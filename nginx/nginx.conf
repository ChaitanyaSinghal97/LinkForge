upstream backend_servers {
    server backend:5000;
}

server {
    listen 80;

    location = / {
        return 302 /login;
    }

    location /auth/ {
        proxy_pass http://backend_servers;
    }

    location = /links {
        proxy_pass http://backend_servers;
    }

    location /links/ {
        proxy_pass http://backend_servers;
    }

    location = /login {
        proxy_pass http://frontend:80;
    }

    location = /signup {
        proxy_pass http://frontend:80;
    }

    location = /dashboard {
        proxy_pass http://frontend:80;
    }

    location /assets/ {
        proxy_pass http://frontend:80;
    }

    location / {
        proxy_pass http://backend_servers;
    }
}